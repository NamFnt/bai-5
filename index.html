<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webside</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <div class="menu_bar">
            <div class="icon">
                <div class="icon_1"><img src="element-4.svg" alt="icon"></div>
                <img class="icon_2" src="graph.svg" alt="icon">
                <img class="icon_2" src="medal-star.svg" alt="icon">
                <img class="icon_2" src="messages.svg" alt="icon">
                <img class="icon_2" src="setting-2.svg" alt="icon">
            </div>
        </div>
        <div class="main">
            <header class="head">
                <div class="welcome">
                    <h1>Welcome, Amanda</h1>
                    <p>Tue, 07 June 2022</p>
                </div>
                <div class="welcome_1">
                    <p class="search"><img src="search-normal.svg" alt="Search"><input placeholder="Search"></p>
                    <div class="notifi"><img src="notification-bing.svg" alt="Noti"></div>
                    <div><img class="avata" src="56fd40a1c28a9a0d13520e093897c94a2a5b1d5a.png" alt="Avata"></div>
                </div>
            </header>
            <div class="infor">
                <img class="title" src="452dd41e6eea8d05642679295aa17dfe2a264a07.jpg" alt="...">
                <div class="infor_user">
                    <div class="user">
                        <div class="id">
                            <img class="avat" src="08f8792cc4560e6955e1cf3aa9aa4edfe7cc29bf.png" alt="Avata">
                            <div class="name">
                                <h1>Alexa Rawles</h1>
                                <p>alexarawles@gmail.com</p>
                            </div>
                        </div>
                        <p class="button">Edit</p>
                    </div>
                    <div class="user_input">
                        <div class="input_group">
                            <label for="full_name">Full Name</label>
                            <div class="input"><input id="full_name" placeholder="Your First Name"></div>
                        </div>
                        <div class="input_group">
                            <label for="nick_name">Nick name</label>
                            <div class="input"><input id="nick_name" placeholder="Your Nick Name"></div>
                        </div>

                        <div class="input_group">
                            <label for="gender">Gender</label>
                            <div class="input"><input id="gender" placeholder="Your Gender"><img src="dropDown_icon.svg" alt="icon"></div>
                        </div>
                        <div class="input_group">
                            <label for="country">Country</label>
                            <div class="input"><input id="country" placeholder="Your Country"><img src="dropDown_icon.svg" alt="icon"></div>
                        </div>

                        <div class="input_group">
                            <label for="language">Language</label>
                            <div class="input"><input id="language" placeholder="Your Language"><img src="dropDown_icon.svg" alt="icon"></div>
                        </div>
                        <div class="input_group">
                            <label for="timezone">Time Zone</label>
                            <div class="input"><input id="timezone" placeholder="Your Time Zone"><img src="dropDown_icon.svg" alt="icon"></div>
                        </div>
                    </div>
                    <div class="email">
                        <h1>My email Address</h1>
                        <div class="email_box">
                            <div class="box"><img src="sms.svg" alt="Email"></div>
                            <div class="email_name">
                                <p class="addre">alexarawles@gmail.com</p>
                                <p class="day">1 month ago</p>
                            </div>
                        </div>
                        <div class="add_email"><p>+Add Email Address</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>    
</body>
</html>
